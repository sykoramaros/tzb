name: knip

# Dead-code report (unused files, exports, dependencies). Advisory only —
# runs weekly and on demand, never on push, so it is not a commit gate.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

jobs:
  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx knip
